<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F9FA" />
    <title>FinanceHub Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f8f9fa;
        --surface: #ffffff;
        --primary: #0f766e;
        --text-primary: #111827;
        --text-secondary: #6b7280;
        --border: #e5e7eb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a0a0a;
          --surface: #141414;
          --primary: #14b8a6;
          --text-primary: #f9fafb;
          --text-secondary: #9ca3af;
          --border: #262626;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--text-primary);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overscroll-behavior: none;
      }

      main {
        width: min(100%, 360px);
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        text-align: center;
        box-shadow: 0 20px 60px rgb(0 0 0 / 12%);
      }

      img {
        width: 64px;
        height: 64px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 22px;
        padding: 0 18px;
        border-radius: 12px;
        background: var(--primary);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo-icon.png" alt="FinanceHub" />
      <h1>FinanceHub is offline</h1>
      <p>Your saved app shell is available when cached. Reconnect to refresh the latest data and assets.</p>
      <a href="./">Open FinanceHub</a>
    </main>
  </body>
</html>
